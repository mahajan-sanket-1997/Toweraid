name: Update TowerAid Auth UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-auth:
    if: "!contains(github.event.head_commit.message, '[auth-ui-patched]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update authentication screen
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('lib/main.dart')
          text = path.read_text()
          if '// TOWERAID_AUTH_V2' in text:
              print('Auth UI already updated.')
              raise SystemExit(0)

          replacement = r'''// TOWERAID_AUTH_V2
class ResidentSignIn extends StatefulWidget {
  const ResidentSignIn({super.key});

  @override
  State<ResidentSignIn> createState() => _ResidentSignInState();
}

class _ResidentSignInState extends State<ResidentSignIn> {
  final emailController = TextEditingController();
  final otpController = TextEditingController();
  final nameController = TextEditingController();
  bool otpSent = false;
  bool loading = false;
  bool isRegistering = true;

  @override
  void dispose() {
    emailController.dispose();
    otpController.dispose();
    nameController.dispose();
    super.dispose();
  }

  String get email => emailController.text.trim();
  String get fullName => nameController.text.trim();

  void resetOtp() {
    setState(() {
      otpSent = false;
      otpController.clear();
    });
  }

  Future<void> sendOtp() async {
    final client = SupabaseConfig.client;
    if (client == null) {
      ScaffoldMessenger.of(context).showSnackBar(
        const SnackBar(content: Text('TowerAid server is not configured in this build.')),
      );
      return;
    }
    if (!RegExp(r'^[^@\s]+@[^@\s]+\.[^@\s]+$').hasMatch(email)) {
      ScaffoldMessenger.of(context).showSnackBar(
        const SnackBar(content: Text('Enter a valid email address.')),
      );
      return;
    }
    if (isRegistering && fullName.length < 2) {
      ScaffoldMessenger.of(context).showSnackBar(
        const SnackBar(content: Text('Enter your full name to register.')),
      );
      return;
    }

    setState(() => loading = true);
    try {
      await client.auth.signInWithOtp(
        email: email,
        shouldCreateUser: isRegistering,
        data: isRegistering ? {'full_name': fullName} : null,
      );
      if (!mounted) return;
      setState(() => otpSent = true);
      ScaffoldMessenger.of(context).showSnackBar(
        SnackBar(content: Text(isRegistering
            ? 'Verification code sent. Complete registration with the code.'
            : 'Verification code sent to your email.')),
      );
    } catch (e) {
      if (mounted) {
        ScaffoldMessenger.of(context).showSnackBar(
          const SnackBar(content: Text('Could not reach TowerAid. Check your internet connection and try again.')),
        );
      }
    } finally {
      if (mounted) setState(() => loading = false);
    }
  }

  Future<void> verifyOtp() async {
    final client = SupabaseConfig.client;
    if (client == null) return;
    final code = otpController.text.trim();
    if (!RegExp(r'^\d{6}$').hasMatch(code)) {
      ScaffoldMessenger.of(context).showSnackBar(
        const SnackBar(content: Text('Enter the 6-digit verification code.')),
      );
      return;
    }

    setState(() => loading = true);
    try {
      await client.auth.verifyOTP(
        email: email,
        token: code,
        type: OtpType.email,
      );

      if (isRegistering && client.auth.currentUser != null) {
        try {
          await client.rpc('claim_demo_flat', params: {
            'full_name_input': fullName,
            'phone_input': email,
          });
        } catch (_) {
          // The demo flat is optional for authentication; production onboarding
          // will replace this with society/tower/flat verification.
        }
      }

      if (mounted) {
        ScaffoldMessenger.of(context).showSnackBar(
          SnackBar(content: Text(isRegistering
              ? 'Registration complete. Welcome to TowerAid!'
              : 'Welcome back to TowerAid.')),
        );
      }
    } catch (e) {
      if (mounted) {
        ScaffoldMessenger.of(context).showSnackBar(
          const SnackBar(content: Text('Invalid or expired code. Please request a new code and try again.')),
        );
      }
    } finally {
      if (mounted) setState(() => loading = false);
    }
  }

  @override
  Widget build(BuildContext context) => Scaffold(
        body: SafeArea(
          child: Center(
            child: SingleChildScrollView(
              padding: const EdgeInsets.all(24),
              child: ConstrainedBox(
                constraints: const BoxConstraints(maxWidth: 430),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.stretch,
                  children: [
                    const SizedBox(height: 30),
                    Container(
                      width: 82,
                      height: 82,
                      decoration: BoxDecoration(
                        color: Colors.red,
                        borderRadius: BorderRadius.circular(24),
                      ),
                      child: const Icon(Icons.shield_outlined, color: Colors.white, size: 48),
                    ),
                    const SizedBox(height: 28),
                    const Text('TowerAid', style: TextStyle(fontSize: 34, fontWeight: FontWeight.bold)),
                    const SizedBox(height: 6),
                    const Text(
                      'Emergency response for your residential community',
                      style: TextStyle(fontSize: 16, color: Colors.grey),
                    ),
                    const SizedBox(height: 28),
                    SegmentedButton<bool>(
                      segments: const [
                        ButtonSegment(value: true, label: Text('Register'), icon: Icon(Icons.person_add_outlined)),
                        ButtonSegment(value: false, label: Text('Sign in'), icon: Icon(Icons.login_outlined)),
                      ],
                      selected: {isRegistering},
                      onSelectionChanged: loading || otpSent
                          ? null
                          : (selection) => setState(() => isRegistering = selection.first),
                    ),
                    const SizedBox(height: 18),
                    Card(
                      child: Padding(
                        padding: const EdgeInsets.all(20),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.stretch,
                          children: [
                            Text(
                              isRegistering ? 'Create your resident account' : 'Resident sign in',
                              style: const TextStyle(fontSize: 22, fontWeight: FontWeight.bold),
                            ),
                            const SizedBox(height: 8),
                            Text(
                              isRegistering
                                  ? 'Register with your email. We will send a secure verification code.'
                                  : 'Use your registered email address to receive a secure verification code.',
                            ),
                            if (isRegistering) ...[
                              const SizedBox(height: 20),
                              TextField(
                                controller: nameController,
                                enabled: !otpSent && !loading,
                                textCapitalization: TextCapitalization.words,
                                decoration: const InputDecoration(
                                  labelText: 'Full name',
                                  hintText: 'Your name',
                                  prefixIcon: Icon(Icons.person_outline),
                                  border: OutlineInputBorder(),
                                ),
                              ),
                            ],
                            const SizedBox(height: 16),
                            TextField(
                              controller: emailController,
                              keyboardType: TextInputType.emailAddress,
                              enabled: !otpSent && !loading,
                              decoration: const InputDecoration(
                                labelText: 'Email address',
                                hintText: 'resident@example.com',
                                prefixIcon: Icon(Icons.email_outlined),
                                border: OutlineInputBorder(),
                              ),
                            ),
                            if (otpSent) ...[
                              const SizedBox(height: 16),
                              TextField(
                                controller: otpController,
                                keyboardType: TextInputType.number,
                                maxLength: 6,
                                decoration: const InputDecoration(
                                  labelText: '6-digit verification code',
                                  border: OutlineInputBorder(),
                                ),
                              ),
                            ],
                            const SizedBox(height: 8),
                            SizedBox(
                              height: 52,
                              child: FilledButton(
                                onPressed: loading ? null : (otpSent ? verifyOtp : sendOtp),
                                child: loading
                                    ? const SizedBox(width: 22, height: 22, child: CircularProgressIndicator(strokeWidth: 2))
                                    : Text(otpSent ? 'Verify & Continue' : (isRegistering ? 'Register & Send Code' : 'Send Code')),
                              ),
                            ),
                            if (otpSent) ...[
                              const SizedBox(height: 12),
                              TextButton(
                                onPressed: loading ? null : resetOtp,
                                child: const Text('Change email address'),
                              ),
                            ],
                          ],
                        ),
                      ),
                    ),
                    const SizedBox(height: 20),
                    const Text(
                      'Email is used for secure authentication and emergency account identification.',
                      textAlign: TextAlign.center,
                      style: TextStyle(fontSize: 12, color: Colors.grey),
                    ),
                  ],
                ),
              ),
            ),
          ),
        ),
      );
}
'''

          pattern = r'class ResidentSignIn extends StatefulWidget \{.*?\n\}\n\nenum Role'
          updated, count = re.subn(pattern, replacement + '\nenum Role', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not locate ResidentSignIn block.')
          path.write_text(updated)

      - name: Commit auth update and remove patch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/update-auth-ui.yml
          git add lib/main.dart .github/workflows/update-auth-ui.yml
          git commit -m "Add resident registration and sign-in flow [auth-ui-patched]"
          git push
